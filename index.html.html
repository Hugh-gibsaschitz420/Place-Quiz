```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Real or Fake City Quiz</title>

<style>

    body{
        margin:0;
        padding:30px;
        font-family:Arial, sans-serif;
        background:#0f172a;
        color:white;
    }

    h1{
        text-align:center;
        margin-bottom:10px;
        color:#38bdf8;
        font-size:42px;
    }

    p{
        text-align:center;
        color:#cbd5e1;
        margin-bottom:30px;
    }

    .board{
        display:grid;
        grid-template-columns:repeat(4, 1fr);
        gap:20px;
        max-width:1300px;
        margin:auto;
    }

    .tile{
        background:linear-gradient(135deg,#0ea5e9,#0369a1);
        padding:35px 20px;
        border-radius:18px;
        text-align:center;
        font-size:24px;
        font-weight:bold;
        cursor:pointer;
        transition:0.25s;
        min-height:120px;

        display:flex;
        align-items:center;
        justify-content:center;
    }

    .tile:hover{
        transform:scale(1.05);
    }

    .correct{
        background:#16a34a !important;
        color:white;
    }

    .wrong{
        background:#dc2626 !important;
        color:white;
    }

    .controls{
        text-align:center;
        margin-top:35px;
    }

    button{
        padding:14px 24px;
        border:none;
        border-radius:12px;
        background:#f59e0b;
        color:black;
        font-size:18px;
        font-weight:bold;
        cursor:pointer;
    }

    .score{
        text-align:center;
        margin-bottom:25px;
        font-size:22px;
    }

    @media(max-width:900px){
        .board{
            grid-template-columns:repeat(2,1fr);
        }
    }

    @media(max-width:600px){
        .board{
            grid-template-columns:1fr;
        }
    }

</style>
</head>

<body>

<h1>REAL OR FAKE?</h1>

<p>Click the city names to reveal if they are REAL or FAKE</p>

<div class="score">
    ✅ Correct: <span id="correct">0</span>
    &nbsp;&nbsp;&nbsp;
    ❌ Wrong: <span id="wrong">0</span>
</div>

<div class="board" id="board"></div>

<div class="controls">
    <button onclick="resetGame()">Reset Game</button>
</div>

<script>

const cities = [

    { name:"Belthangadi", real:true },
    { name:"Kutta", real:true },
    { name:"Googal", real:true },
    { name:"Cock Burn Road", real:true },
    { name:"Doddaanekundi", real:true },
    { name:"Choodasandra", real:true },
    { name:"Mullur", real:true },

    { name:"Yeinus Street", real:false },
    { name:"Badnecaaipalya", real:false },
    { name:"Rawdrigopuram", real:false },
    { name:"Mullarpet", real:false },
    { name:"Beega akganghalli", real:false },
    { name:"Pounds Town", real:false },
    { name:"Assayya Road", real:false },
    { name:"KKK Nagar", real:false },
    { name:"Ammukusandra", real:false },
    { name:"Billegowda Road", real:false },
    { name:"Caanonkunte", real:false },
    { name:"Seisietsandra", real:false },
    { name:"haarambhalli", real:false }

];

let correctScore = 0;
let wrongScore = 0;

function shuffle(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
    }

    return array;
}

function createBoard(){

    const board = document.getElementById("board");

    board.innerHTML = "";

    shuffle(cities);

    cities.forEach(city => {

        const tile = document.createElement("div");

        tile.classList.add("tile");

        tile.innerText = city.name;

        tile.dataset.real = city.real;

        tile.onclick = () => reveal(tile);

        board.appendChild(tile);
    });
}

function reveal(tile){

    if(tile.classList.contains("correct") ||
       tile.classList.contains("wrong")){
        return;
    }

    const isReal = tile.dataset.real === "true";

    if(isReal){

        tile.classList.add("correct");

        tile.innerHTML += "<br><br>✅ REAL";

        correctScore++;

        document.getElementById("correct").innerText = correctScore;

    } else {

        tile.classList.add("wrong");

        tile.innerHTML += "<br><br>❌ FAKE";

        wrongScore++;

        document.getElementById("wrong").innerText = wrongScore;
    }
}

function resetGame(){

    correctScore = 0;
    wrongScore = 0;

    document.getElementById("correct").innerText = 0;
    document.getElementById("wrong").innerText = 0;

    createBoard();
}

createBoard();

</script>

</body>
</html>
